services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    container_name: go-agent-kafka
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/redpanda/data

  canal:
    image: canal/canal-server:v1.1.7
    container_name: go-agent-canal
    depends_on:
      - kafka
    volumes:
      - ./deploy/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./deploy/canal/example:/home/admin/canal-server/conf/example

  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: go-agent-kafka-console
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      - KAFKA_BROKERS=kafka:29092

volumes:
  kafka_data: